<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Character Test</title>

    <link rel="stylesheet" href="css/character.css">

    <script src="js/character.js" defer></script>
</head>

<body>

    <h1>Character Test</h1>

    <div class="character-container">

        <img
            class="room-character"
            src="images/characters/iggy-sad.png"
            data-happy="images/characters/iggy-happy.png"
            data-sad="images/characters/iggy-sad.png"
            alt="Milo"
        >

    </div>

    <button onclick="
        window.dispatchEvent(
            new CustomEvent('study:state', {
                detail: {status: 'running'}
            })
        )
    ">
        Start
    </button>

    <button onclick="
        window.dispatchEvent(
            new CustomEvent('study:state', {
                detail: {status: 'paused'}
            })
        )
    ">
        Pause
    </button>

</body>
</html>
